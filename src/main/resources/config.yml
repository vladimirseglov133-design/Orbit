holograms:
  auto-update: true
  initial-update-delay-seconds: 5
  update-interval-seconds: 15
  top-size: 10
  force-load-chunks: true
  line-spacing: 0.28
  titles:
    kills: "&c&lТОП ПО ПОБЕДАМ"
    coins: "&6&lТОП ПО БАЛАНСУ"
  separator-line: "&7"
  empty-line: "&7Пока никто не в топе"
  entry-format: "{color}#{place} &f{name} &7- &e{value}{unit}"
  place-colors: ["&6", "&7", "&c", "&f", "&f", "&f", "&f", "&f", "&f", "&f"]
  units:
    kills: " побед"
    coins: " монет"
  see-through: false
  shadowed: true
  default-background: true
  background-color: "000000"
  background-alpha: 90

