# Orbit — игровые настройки.
# После редактирования выполните /orbit reload. arena.world требует перезапуска.

# Вернуть игроков после дуэли в исходные точки вместо лобби.
return-to-original-location: false

lobby:
  world: world
  x: 200
  y: -27
  z: -95.5
  yaw: 0
  pitch: 0

arena:
  world: duels_world
  schematic: schematics/arena.schem
  spacing: 200
  base-y: 100
  chunk-preload-radius: 3
  world-time: 6000
  void-y-limit: 50
  game-rules:
    daylight-cycle: false
    weather-cycle: false
    immediate-respawn: true
  # Смещения от начала отдельной арены.
  spawn1:
    x: 34
    y: 1
    z: 32
  spawn2:
    x: -34
    y: 1
    z: 32

# Чтобы задать место кейса, используйте /setcase на сундуке.
